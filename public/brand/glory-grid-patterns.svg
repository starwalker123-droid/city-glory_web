    <use xlink:href="#m-stamp" transform="translate(297,30) scale(1.7)"/>
    <text class="s b" x="297" y="96" font-size="10" letter-spacing="1.4" text-anchor="middle">3. PATTERN FAMILY</text>
  </g>

