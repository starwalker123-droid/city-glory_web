  <text class="s b" x="72" y="634" font-size="10.5" letter-spacing="1.2">=  1 MODULE</text>

  <rect x="45" y="660" width="30" height="30" fill="none" stroke="#1c1c1c" stroke-width="1.2"/>
  <path d="M55 660 V690 M65 660 V690 M45 670 H75 M45 680 H75" stroke="#1c1c1c" stroke-width="0.8"/>
