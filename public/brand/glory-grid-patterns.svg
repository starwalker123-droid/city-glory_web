      <path d="M-5.5 4.5 C-3.6 9.1 -1.4 12.3 1.8 15" stroke-width="2.2"/>
    </g>
    <g id="m-castle" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
