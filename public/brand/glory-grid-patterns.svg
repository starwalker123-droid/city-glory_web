<svg width="1500" height="1060" viewBox="0 0 1500 1060" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="ggpTitle">
  <title id="ggpTitle">City Glory — Glory Grid patterns, Bratislava</title>
  <defs>
    <pattern id="g9" width="9.375" height="9.375" patternUnits="userSpaceOnUse">
