  <text class="s b" x="92" y="772" font-size="10.5" letter-spacing="1.2">DIAGONALS</text>
  <text class="s sub" x="92" y="788" font-size="10">For crossed motifs and dynamic forms.</text>

  <path d="M45 816 H75" stroke="#1c1c1c" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text class="s b" x="92" y="820" font-size="10.5" letter-spacing="1.2">BASELINES</text>
  <text class="s sub" x="92" y="836" font-size="10">Ensure consistent alignment and rhythm.</text>

