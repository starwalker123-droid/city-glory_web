  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; fill: #141414; }
    .s { font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1c1c1c; }
    .b { font-weight: 700; }
    .m { font-weight: 500; }
    .sub { fill: #6f6a60; font-weight: 500; }
    .ic { stroke: #1c1c1c; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fl { fill: #1c1c1c; stroke: none; }
    .box { fill: url(#g9); stroke: #DAD2C4; stroke-width: 1; }
    .gd { stroke: #1c1c1c; fill: none; }
    .lt { stroke: #C9C0AF; fill: none; }
    .dash { stroke: #4a463e; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
  </style>

  <rect width="1500" height="1060" fill="#FBF6ED"/>

  <!-- ============ HEADER ============ -->
  <g class="ic" transform="translate(45,40)" stroke-width="2.2">
    <path d="M2 38 V4 H14 V10 H22 V4 H34 V10 H42 V4 H54 V38 H2 Z"/>
    <path d="M16 17 H23 V24 H16 Z M33 17 H40 V24 H33 Z M16 27 H23 V34 H16 Z M33 27 H40 V34 H33 Z"/>
    <path d="M2 47 Q8.5 42 15 47 Q21.5 52 28 47 Q34.5 42 41 47 Q47.5 52 54 47"/>
  </g>
  <text class="serif" x="128" y="98" font-size="60">Glory Grid</text>
  <text class="s b" x="130" y="138" font-size="12.5" letter-spacing="3">ONE GRID.  MANY PATTERNS.  ONE CITY.</text>

  <line x1="575" y1="44" x2="575" y2="168" stroke="#1c1c1c" stroke-width="1"/>

  <text class="s m" x="612" y="72" font-size="15" fill="#33302a">All City Glory patterns grow from the</text>
  <text class="s m" x="612" y="96" font-size="15" fill="#33302a">same modular grid. Brand marks, stamps</text>
  <text class="s m" x="612" y="120" font-size="15" fill="#33302a">and crossed motifs share one geometric</text>
  <text class="s m" x="612" y="144" font-size="15" fill="#33302a">language with the landmark icons.</text>

  <!-- steps -->
  <g transform="translate(1020,48)">
    <rect x="0" y="0" width="66" height="66" class="box" stroke="#1c1c1c" stroke-width="1.2"/>
    <text class="s b" x="33" y="96" font-size="10" letter-spacing="1.4" text-anchor="middle">1. MASTER GRID</text>
    <g class="gd" stroke-width="1.5"><path d="M84 33 H116 M116 33 l-7 -4.5 M116 33 l-7 4.5"/></g>
    <rect x="132" y="0" width="66" height="66" class="box" stroke="#1c1c1c" stroke-width="1.2"/>
    <circle cx="165" cy="33" r="20" class="lt" stroke-dasharray="3 3"/>
    <path d="M138 60 L192 6" class="lt" stroke-width="0.8"/>
    <g class="ic" stroke-width="1.8"><path d="M150 45 C150 30 158 22 165 18 M180 45 C180 30 172 22 165 18" /><path d="M148 48 H182"/></g>
    <text class="s b" x="165" y="96" font-size="10" letter-spacing="1.4" text-anchor="middle">2. BUILD</text>
